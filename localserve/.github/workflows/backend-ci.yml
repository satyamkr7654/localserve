name: backend-ci
on:
  pull_request:
    paths: ["backend/**", "pom.xml", ".github/workflows/backend-ci.yml"]
  push:
    branches: ["main"]
    paths: ["backend/**", "pom.xml", ".github/workflows/backend-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress -pl backend/application -am verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "backend/**/target/*-reports/**"
          if-no-files-found: warn
          retention-days: 14
