name: phase7-ci

on:
  push:
    branches: ["phase-7-authentication"]
  pull_request:
    paths:
      - "localserve/backend/**"
      - "localserve/frontend/**"
      - "localserve/infrastructure/**"
      - ".github/workflows/phase7-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: localserve/backend/pom.xml
      - name: Verify backend
        working-directory: localserve/backend
        run: mvn --batch-mode --no-transfer-progress -pl application -am verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: localserve/frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: localserve/frontend
        run: npm ci --ignore-scripts
      - name: Verify frontend
        working-directory: localserve/frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"
        run: npm run check
