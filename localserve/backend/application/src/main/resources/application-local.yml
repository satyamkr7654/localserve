spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/localserve?replicaSet=rs0}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
logging:
  structured:
    format:
      console: logstash
localserve:
  security:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
    secure-cookies: false
  runtime:
    environment: local
BREACHED_PASSWORD_CHECK_ENABLED: false
